[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-supervisor"
version = "0.1.0"
description = "Windows Telegram voice and approval-gated Codex supervisor"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

